[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "human-path-testing"
version = "0.1.0"
description = "Evidence-first UI route replay with a constrained Playwright runner"
requires-python = ">=3.12"
dependencies = ["playwright==1.62.0", "pydantic>=2.12,<3"]

[project.optional-dependencies]
test = ["pytest>=9,<10"]

[project.scripts]
hpt = "hpt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hpt = ["fixture.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["browser: starts real Chromium"]

